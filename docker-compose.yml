services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: content_tracking
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
  api:
    build: ./apps/api
    env_file: .env
    depends_on: [postgres]
    ports: ["4000:4000"]
volumes:
  postgres_data:
